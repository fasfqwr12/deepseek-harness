<title>飞行单车 · 猴子 & 鹈鹕</title>
<style>
:root{--sp:1;--ink:#eaf2fb;--dim:#9fb4c8;--acc:#ffc247}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 50% 0%,#16263c 0%,#0b1421 70%,#070d16 100%);
  color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 16px}
.wrap{width:min(1180px,100%)}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 4px 10px}
h1{font-size:20px;margin:0;letter-spacing:1px;font-weight:700}
h1 span{color:var(--acc)}
.sub{font-size:12.5px;color:var(--dim);letter-spacing:.4px}
.card{position:relative;border-radius:18px;overflow:hidden;background:#0e1b2b;
  box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07) inset}
svg#scene{display:block;width:100%;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:12px}
button{background:#16293e;color:var(--ink);border:1px solid rgba(255,255,255,.14);border-radius:10px;
  padding:9px 15px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.18s}
button:hover{background:#1f3a55;border-color:rgba(255,194,71,.55);color:#ffe6b0}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(180deg,#ffce5c,#f0a52c);color:#3a2405;border-color:#ffd98a;font-weight:700}
.speed{margin-left:auto;font-size:12.5px;color:var(--dim)}
.speed b{color:var(--acc);font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--dim);margin-top:8px}

.drift-far  .band-a{animation:driftA calc(260s / var(--sp)) linear infinite}
.drift-far  .band-b{animation:driftB calc(260s / var(--sp)) linear infinite}
.drift-slow .band-a{animation:driftA calc(120s / var(--sp)) linear infinite}
.drift-slow .band-b{animation:driftB calc(120s / var(--sp)) linear infinite}
.drift-fast .band-a{animation:driftA calc(46s / var(--sp)) linear infinite}
.drift-fast .band-b{animation:driftB calc(46s / var(--sp)) linear infinite}
.drift-near .band-a{animation:driftA calc(15s / var(--sp)) linear infinite}
.drift-near .band-b{animation:driftB calc(15s / var(--sp)) linear infinite}
.sea-scroll .band-a{animation:driftA calc(7s / var(--sp)) linear infinite}
.sea-scroll .band-b{animation:driftB calc(7s / var(--sp)) linear infinite}
@keyframes driftA{from{transform:translateX(0)}to{transform:translateX(-2400px)}}
@keyframes driftB{from{transform:translateX(2400px)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important}}
</style>
</head>

<script>
function setSpeed(v){
  v = Math.max(0.25, Math.min(2.2, v));
  document.documentElement.style.setProperty('--sp', v);
  var l = document.querySelectorAll('#scene animate, #scene animateTransform');
  for (var i=0;i<l.length;i++){
    var b = parseFloat(l[i].getAttribute('data-base') || '1');
    l[i].setAttribute('dur', (b/v).toFixed(3)+'s');
  }
  document.getElementById('spv').textContent = v.toFixed(2)+'x';
}
var sp = 1;
document.getElementById('btnFast').onclick = function(){ sp = Math.min(2.2, sp+0.25); setSpeed(sp); };
document.getElementById('btnSlow').onclick = function(){ sp = Math.max(0.25, sp-0.25); setSpeed(sp); };
document.getElementById('btnReset').onclick = function(){ sp = 1; setSpeed(sp); };
document.getElementById('btnHonk').onclick = function(){
  document.getElementById('honkFade').beginElement();
  document.getElementById('honkBeak').beginElement();
};
document.getElementById('scene').addEventListener('click', function(){
  document.getElementById('btnHonk').click();
});
setSpeed(1);
</script>
